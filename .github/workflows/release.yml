name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip from .distignore
        run: |
          mkdir -p build/redirect-404-sentinel
          rsync -a --exclude-from=.distignore --exclude=.distignore --exclude=build --exclude=.git ./ build/redirect-404-sentinel/
          (cd build && zip -rq ../redirect-404-sentinel-${GITHUB_REF_NAME#v}.zip redirect-404-sentinel)
      - uses: softprops/action-gh-release@v2
        with:
          files: redirect-404-sentinel-*.zip
          generate_release_notes: true